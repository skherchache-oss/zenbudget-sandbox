<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBudget</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
      // On ne définit window.process que s'il n'existe pas pour ne pas écraser les variables de Vite/Vercel
      if (!window.process) window.process = { env: {} };
      if (!window.process.env) window.process.env = {};
    </script>

    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #020617; /* Slate-950 pour éviter le flash blanc au départ */
          margin: 0; padding: 0;
          -webkit-tap-highlight-color: transparent;
          overflow-x: hidden;
        }
        #root { min-height: 100vh; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animation subtile pour le logo au chargement */
        @keyframes pulse-soft {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-pulse-soft { animation: pulse-soft 2s infinite ease-in-out; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
        "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
        "@google/generative-ai": "https://esm.sh/@google/generative-ai@0.21.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <div id="initial-loader" class="h-screen w-full flex flex-col items-center justify-center bg-slate-950">
            <div class="flex flex-col items-center gap-4 animate-pulse-soft">
                <img 
                    src="/ZB-logo-192.png" 
                    alt="ZenBudget" 
                    class="w-20 h-20 rounded-[24px] shadow-2xl border border-white/10"
                />
                <div class="text-center">
                    <h1 class="text-3xl font-black tracking-tighter italic text-white">
                        ZenBudget
                    </h1>
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400 mt-1">
                        Chargement...
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
