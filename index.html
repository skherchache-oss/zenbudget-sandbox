<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZenBudget</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <script>
      if (!window.process) window.process = { env: {} };
      if (!window.process.env) window.process.env = {};
    </script>

    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #020617; 
          margin: 0; padding: 0;
          -webkit-tap-highlight-color: transparent;
          overflow: hidden; /* Empêche le scroll pendant le chargement */
        }
        #root { min-height: 100vh; }
        
        @keyframes pulse-soft {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(0.96); opacity: 0.85; }
        }
        .animate-pulse-soft { animation: pulse-soft 2.5s infinite ease-in-out; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
        "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
        "@google/generative-ai": "https://esm.sh/@google/generative-ai@0.21.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617;">
            <div class="animate-pulse-soft" style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
                <img 
                    src="/ZB-logo-192.png" 
                    alt="ZenBudget" 
                    style="width: 120px; height: 120px; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1);"
                />
                <div style="text-align: center;">
                    <h1 style="color: white; font-size: 36px; font-weight: 900; font-style: italic; letter-spacing: -0.05em; margin: 0; line-height: 1;">
                        ZenBudget
                    </h1>
                    <p style="color: #6366f1; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.4em; margin-top: 8px; opacity: 0.8;">
                        Chargement
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
